name: Dev Android

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and apply native patches
        run: npm ci --prefer-offline --no-audit

      - name: Run unit tests
        run: npm test -- --ci --runInBand --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_number }}
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  build:
    name: Build installable APKs
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Install dependencies and apply native patches
        run: npm ci --prefer-offline --no-audit

      - name: Build standalone test APKs
        working-directory: android
        run: >-
          bash ./gradlew :app:assembleLocalTest
          --no-daemon --build-cache --stacktrace --max-workers=2

      - name: Collect APKs and checksums
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p artifacts
          version=$(node -p "require('./package.json').version")
          for apk in android/app/build/outputs/apk/localTest/*.apk; do
            name=$(basename "$apk")
            cp "$apk" "artifacts/MusicFree-${version}-${COMMIT_SHA:0:7}-${name}"
          done
          (cd artifacts && sha256sum ./*.apk > SHA256SUMS.txt)
          {
            echo '### Dev APKs'
            echo "Version: ${version} | Commit: ${COMMIT_SHA}"
            echo ''
            echo 'Download the APK artifact below. Use the universal APK for any supported Android CPU.'
            echo 'These standalone test builds use the debug key and a separate application ID.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MusicFree-dev-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-diagnostics-${{ github.run_number }}
          path: |
            android/build/reports/
            android/app/build/reports/
          retention-days: 7
          if-no-files-found: ignore